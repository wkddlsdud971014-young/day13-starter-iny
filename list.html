<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales</title>
<script defer src="https://cdn.vercel-analytics.com/v1/script.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    margin: 0;
    padding: 60px 20px;
    background: linear-gradient(135deg, #f5f1eb 0%, #ede7df 100%);
    color: #1a1815;
    min-height: 100vh;
  }
  .container { max-width: 800px; margin: 0 auto; }

  .header {
    margin-bottom: 50px;
    animation: fadeIn 0.6s ease-in;
  }
  h1 {
    font-size: 48px;
    font-weight: 400;
    margin: 0 0 12px 0;
    letter-spacing: 1px;
  }
  .subtitle {
    color: #9b8f85;
    font-size: 15px;
    margin: 0;
    font-weight: 300;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e8e3de;
  }
  .count {
    font-size: 14px;
    color: #9b8f85;
    font-weight: 400;
  }
  .cta {
    color: #2563eb;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: opacity 0.3s;
  }
  .cta:hover { opacity: 0.7; }

  .list-container {
    background: white;
    border-radius: 10px;
    border: 1px solid #f0ede8;
    overflow: hidden;
  }

  .list-header {
    display: grid;
    grid-template-columns: 60px 160px 140px 1fr 60px 80px;
    gap: 16px;
    padding: 20px 24px;
    background: #f9f6f1;
    border-bottom: 1px solid #e8e3de;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: #9b8f85;
  }

  .list-item {
    display: grid;
    grid-template-columns: 60px 160px 140px 1fr 60px 80px;
    gap: 16px;
    padding: 18px 24px;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
    border-bottom: 1px solid #f0ede8;
    animation: fadeInList 0.6s ease-out forwards;
    opacity: 0;
  }
  .list-item:nth-child(1) { animation-delay: 0.1s; }
  .list-item:nth-child(2) { animation-delay: 0.15s; }
  .list-item:nth-child(3) { animation-delay: 0.2s; }
  .list-item:nth-child(n+4) { animation-delay: 0.25s; }

  .list-item:hover {
    background: #f9f6f1;
    transform: translateX(4px);
  }
  .list-item:last-child {
    border-bottom: none;
  }

  .item-drink {
    font-size: 32px;
    text-align: center;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: white;
  }
  .tag-americano { background: #8b5a2b; }
  .tag-latte { background: #7a5c4d; }
  .tag-matcha { background: #5a8050; }
  .tag-cocoa { background: #6b4a8b; }
  .tag-milk { background: #4a6b8b; }

  .item-customer {
    font-size: 14px;
    font-weight: 500;
    color: #2b2520;
  }

  .item-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .item-product {
    font-size: 14px;
    font-weight: 500;
    color: #2b2520;
  }
  .item-time {
    font-size: 12px;
    color: #9b8f85;
  }

  .item-price {
    font-size: 16px;
    font-weight: 700;
    color: #c9a875;
    text-align: right;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #9b8f85;
    font-size: 15px;
  }

  @media (max-width: 768px) {
    .list-header {
      grid-template-columns: 50px 130px 100px 1fr 45px 70px;
      font-size: 9px;
    }
    .list-item {
      grid-template-columns: 50px 130px 100px 1fr 45px 70px;
      gap: 12px;
      padding: 14px 16px;
    }
    .item-drink {
      font-size: 20px;
    }
    .item-product {
      font-size: 12px;
    }
    .item-time {
      font-size: 11px;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeInList {
    from {
      opacity: 0;
      transform: translateX(-10px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Coffee Sales</h1>
      <p class="subtitle">Recent orders</p>
    </div>

    <div class="info-bar">
      <span class="count" id="count">Loading...</span>
      <a href="index.html" class="cta">+ New Order</a>
    </div>

    <div id="list-container"></div>
    <div class="empty" id="empty" style="display: none;">No orders yet</div>
  </div>

<script>
const PRODUCT_TAGS = {
  "아메리카노": { class: "tag-americano", label: "Americano", emoji: "☕" },
  "카페라떼": { class: "tag-latte", label: "Latte", emoji: "🥛" },
  "율무차": { class: "tag-matcha", label: "Matcha", emoji: "🫖" },
  "코코아": { class: "tag-cocoa", label: "Cocoa", emoji: "🍫" },
  "우유": { class: "tag-milk", label: "Milk", emoji: "🥛" }
};

async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('empty').style.display = 'block';
    return;
  }
  const rows = await res.json();
  document.getElementById('count').textContent = `${rows.length} order${rows.length !== 1 ? 's' : ''}`;

  if (rows.length === 0) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  let html = `
    <div class="list-header">
      <div>ID</div>
      <div>Menu</div>
      <div>Customer</div>
      <div>Date & Time</div>
      <div>Qty</div>
      <div>Total</div>
    </div>
  `;

  html += rows.map(r => {
    const tag = PRODUCT_TAGS[r.product] || { class: "tag-americano", label: r.product, emoji: "☕" };
    const date = new Date(r.purchased_at);
    const time = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    const dateStr = date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit' });
    const fullDateTime = `${dateStr} ${time}`;
    return `
      <div class="list-item" onclick="location.href='detail.html?id=${r.id}'">
        <div style="font-size: 13px; font-weight: 600; color: #2b2520;">
          ${r.id}
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="item-drink" style="margin: 0; font-size: 28px;">${tag.emoji}</div>
          <div>
            <div class="item-tag ${tag.class}">${tag.label}</div>
            <div style="font-size: 13px; font-weight: 500; color: #2b2520; margin-top: 4px;">${r.product}</div>
          </div>
        </div>
        <div class="item-customer">${r.buyer_name}</div>
        <div class="item-time">${fullDateTime}</div>
        <div style="text-align: center; font-size: 14px; font-weight: 500; color: #2b2520;">${r.quantity}잔</div>
        <div class="item-price">₩${r.total_price.toLocaleString()}</div>
      </div>
    `;
  }).join('');

  document.getElementById('list-container').innerHTML = `<div class="list-container">${html}</div>`;
}
load();
</script>
</body>
</html>
