<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    margin: 0;
    padding: 60px 20px;
    background: #faf9f7;
    color: #1a1815;
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  .header {
    margin-bottom: 50px;
    animation: fadeIn 0.6s ease-in;
  }
  h1 {
    font-size: 48px;
    font-weight: 400;
    margin: 0 0 12px 0;
    letter-spacing: 1px;
  }
  .subtitle {
    color: #9b8f85;
    font-size: 15px;
    margin: 0;
    font-weight: 300;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e8e3de;
  }
  .count {
    font-size: 14px;
    color: #9b8f85;
    font-weight: 400;
  }
  .cta {
    color: #2563eb;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: opacity 0.3s;
  }
  .cta:hover { opacity: 0.7; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
  }

  .card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    border: 1px solid #f0ede8;
    overflow: hidden;
    position: relative;
    animation: fadeInCard 0.6s ease-out forwards;
    opacity: 0;
  }
  .card:nth-child(1) { animation-delay: 0.1s; }
  .card:nth-child(2) { animation-delay: 0.15s; }
  .card:nth-child(3) { animation-delay: 0.2s; }
  .card:nth-child(n+4) { animation-delay: 0.25s; }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    border-color: #e0dcd7;
  }

  .drink-visual {
    font-size: 48px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #f5f0eb 0%, #faf9f7 100%);
    border-radius: 8px;
  }

  .card-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }
  .tag-americano { background: #e8dcc8; color: #8b5a2b; }
  .tag-latte { background: #e0d4c4; color: #7a5c4d; }
  .tag-matcha { background: #d4e8d0; color: #5a8050; }
  .tag-cocoa { background: #e0d0e8; color: #6b4a8b; }
  .tag-milk { background: #d4e0f0; color: #4a6b8b; }

  .card-id {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #2b2520;
  }
  .card-buyer {
    font-size: 13px;
    color: #9b8f85;
    margin-bottom: 14px;
    font-weight: 400;
  }

  .card-divider {
    height: 1px;
    background: #f0ede8;
    margin: 14px 0;
  }

  .card-price {
    font-size: 18px;
    font-weight: 700;
    color: #c9a875;
    margin-bottom: 8px;
  }
  .card-time {
    font-size: 12px;
    color: #b8ada3;
    font-weight: 400;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #9b8f85;
    font-size: 15px;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeInCard {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Coffee Sales</h1>
      <p class="subtitle">Recent orders</p>
    </div>

    <div class="info-bar">
      <span class="count" id="count">Loading...</span>
      <a href="index.html" class="cta">+ New Order</a>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display: none;">No orders yet</div>
  </div>

<script>
const PRODUCT_TAGS = {
  "아메리카노": { class: "tag-americano", label: "Americano", emoji: "☕" },
  "카페라떼": { class: "tag-latte", label: "Latte", emoji: "🥛" },
  "율무차": { class: "tag-matcha", label: "Matcha", emoji: "🫖" },
  "코코아": { class: "tag-cocoa", label: "Cocoa", emoji: "🍫" },
  "우유": { class: "tag-milk", label: "Milk", emoji: "🥛" }
};

async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('empty').style.display = 'block';
    return;
  }
  const rows = await res.json();
  document.getElementById('count').textContent = `${rows.length} order${rows.length !== 1 ? 's' : ''}`;

  if (rows.length === 0) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  const html = rows.map(r => {
    const tag = PRODUCT_TAGS[r.product] || { class: "tag-americano", label: r.product, emoji: "☕" };
    const date = new Date(r.purchased_at);
    const time = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `
      <div class="card" onclick="location.href='detail.html?id=${r.id}'">
        <div class="drink-visual">${tag.emoji}</div>
        <div class="card-tag ${tag.class}">${tag.label}</div>
        <div class="card-id">#${r.id}</div>
        <div class="card-buyer">${r.buyer_name}</div>
        <div class="card-divider"></div>
        <div class="card-price">₩${r.total_price.toLocaleString()}</div>
        <div class="card-time">${time}</div>
      </div>
    `;
  }).join('');
  document.getElementById('grid').innerHTML = html;
}
load();
</script>
</body>
</html>
