<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 60px 20px;
    background: #fafaf8;
    color: #1b1d21;
  }
  .container { max-width: 1000px; margin: 0 auto; }

  .header { margin-bottom: 50px; }
  h1 {
    font-size: 48px;
    font-weight: 700;
    margin: 0 0 8px 0;
    letter-spacing: -1px;
    text-transform: uppercase;
  }
  .subtitle { color: #999; font-size: 14px; margin: 0; }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e5e5e3;
  }
  .count { font-size: 14px; color: #666; }
  .cta { color: #2563eb; text-decoration: none; font-size: 14px; font-weight: 600; }
  .cta:hover { text-decoration: underline; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }

  .card {
    background: white;
    border-radius: 8px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid #f0f0f0;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.1);
    border-color: #e0e0e0;
  }

  .card-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tag-americano { background: #d2691e; color: white; }
  .tag-latte { background: #8b6f47; color: white; }
  .tag-matcha { background: #7cb342; color: white; }
  .tag-cocoa { background: #9575cd; color: white; }
  .tag-milk { background: #64b5f6; color: white; }

  .card-id {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #1b1d21;
  }
  .card-buyer {
    font-size: 14px;
    color: #666;
    margin-bottom: 16px;
  }

  .card-divider {
    height: 1px;
    background: #f0f0f0;
    margin: 16px 0;
  }

  .card-price {
    font-size: 24px;
    font-weight: 700;
    color: #d2691e;
    margin-bottom: 8px;
  }
  .card-time {
    font-size: 12px;
    color: #999;
  }

  .empty { text-align: center; padding: 60px 20px; color: #999; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Coffee Sales</h1>
    </div>

    <div class="info-bar">
      <span class="count" id="count">Loading...</span>
      <a href="index.html" class="cta">+ New Order</a>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display: none;">No orders yet</div>
  </div>

<script>
const PRODUCT_TAGS = {
  "아메리카노": { class: "tag-americano", label: "Americano" },
  "카페라떼": { class: "tag-latte", label: "Latte" },
  "율무차": { class: "tag-matcha", label: "Matcha" },
  "코코아": { class: "tag-cocoa", label: "Cocoa" },
  "우유": { class: "tag-milk", label: "Milk" }
};

async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('empty').style.display = 'block';
    return;
  }
  const rows = await res.json();
  document.getElementById('count').textContent = `${rows.length} order${rows.length !== 1 ? 's' : ''}`;

  if (rows.length === 0) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  const html = rows.map(r => {
    const tag = PRODUCT_TAGS[r.product] || { class: "tag-americano", label: r.product };
    const date = new Date(r.purchased_at);
    const time = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `
      <div class="card" onclick="location.href='detail.html?id=${r.id}'">
        <div class="card-tag ${tag.class}">${tag.label}</div>
        <div class="card-id">#${r.id}</div>
        <div class="card-buyer">${r.buyer_name}</div>
        <div class="card-divider"></div>
        <div class="card-price">₩${r.total_price.toLocaleString()}</div>
        <div class="card-time">${time}</div>
      </div>
    `;
  }).join('');
  document.getElementById('grid').innerHTML = html;
}
load();
</script>
</body>
</html>
