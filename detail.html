<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Receipt</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Courier New', 'Monaco', monospace;
    margin: 0;
    padding: 40px 20px;
    background: #faf9f7;
    color: #2b2520;
    min-height: 100vh;
  }
  .container {
    max-width: 380px;
    margin: 0 auto;
    background: white;
    padding: 40px 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 1px solid #f0ede8;
    border-radius: 8px;
    position: relative;
    animation: slideUp 0.6s ease-out;
  }

  .back-link {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 12px;
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
    transition: opacity 0.3s;
  }
  .back-link:hover { opacity: 0.7; }

  .receipt-header {
    text-align: center;
    border-bottom: 2px solid #e8e3de;
    padding-bottom: 24px;
    margin-bottom: 24px;
  }

  .receipt-emoji {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
    animation: bounce 0.6s ease-out;
  }

  h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 4px 0;
    letter-spacing: 1px;
  }
  .order-id {
    font-size: 12px;
    color: #9b8f85;
    margin: 0;
    letter-spacing: 0.5px;
  }

  .receipt-body {
    margin-bottom: 24px;
  }

  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
    gap: 12px;
    font-size: 12px;
  }

  .item-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #9b8f85;
    min-width: 90px;
  }

  .item-value {
    font-weight: 600;
    color: #2b2520;
    text-align: right;
    flex: 1;
  }

  .tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: white;
    margin-bottom: 8px;
  }
  .tag-americano { background: #8b5a2b; }
  .tag-latte { background: #7a5c4d; }
  .tag-matcha { background: #5a8050; }
  .tag-cocoa { background: #6b4a8b; }
  .tag-milk { background: #4a6b8b; }

  .divider {
    height: 1px;
    background: #f0ede8;
    margin: 14px 0;
  }
  .divider-dashed {
    border-top: 1px dashed #e8e3de;
    margin: 14px 0;
  }

  .total-section {
    margin: 20px 0;
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }

  .total-price {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-top: 14px;
    border-top: 2px solid #c9a875;
    margin-top: 14px;
  }
  .total-price .label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #9b8f85;
  }
  .total-price .value {
    font-size: 18px;
    font-weight: 700;
    color: #c9a875;
  }

  .receipt-footer {
    text-align: center;
    border-top: 2px dashed #e8e3de;
    padding-top: 20px;
    margin-top: 20px;
  }

  .timestamp {
    font-size: 11px;
    color: #9b8f85;
    margin-bottom: 16px;
    letter-spacing: 0.3px;
  }

  .barcode {
    font-size: 18px;
    letter-spacing: 2px;
    margin: 12px 0;
    font-weight: 700;
    color: #1a1815;
  }

  .footer-text {
    font-size: 10px;
    color: #9b8f85;
    margin-top: 12px;
  }

  .cut-line {
    text-align: center;
    font-size: 10px;
    color: #e8e3de;
    margin-top: 20px;
    letter-spacing: 2px;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
</style>
</head>
<body>
  <a href="list.html" class="back-link">← Back</a>

  <div class="container">
    <div class="receipt-header">
      <span class="receipt-emoji" id="receipt-emoji">☕</span>
      <h1>ORDER RECEIPT</h1>
      <p class="order-id" id="order-id">Order #<span id="id"></span></p>
    </div>

    <div class="receipt-body">
      <div class="item-row">
        <span class="item-label">Product</span>
        <div style="text-align: right; flex: 1;">
          <div id="tag"></div>
          <div class="item-value" id="product"></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="item-row">
        <span class="item-label">Customer</span>
        <span class="item-value" id="buyer_name"></span>
      </div>

      <div class="item-row">
        <span class="item-label">Qty</span>
        <span class="item-value" id="quantity"></span>
      </div>

      <div class="item-row">
        <span class="item-label">Unit Price</span>
        <span class="item-value" id="price_per_unit"></span>
      </div>

      <div class="divider-dashed"></div>

      <div class="total-price">
        <span class="label">Total</span>
        <span class="value" id="total_price"></span>
      </div>
    </div>

    <div class="receipt-footer">
      <div class="timestamp" id="purchased_at"></div>
      <div class="barcode">| || ||||| |</div>
      <div class="footer-text">www.coffee.local</div>
    </div>

    <div class="cut-line">✂ - - - - - - - -</div>
  </div>

<script>
const PRODUCT_TAGS = {
  "아메리카노": { class: "tag-americano", label: "Americano", emoji: "☕" },
  "카페라떼": { class: "tag-latte", label: "Latte", emoji: "🥛" },
  "율무차": { class: "tag-matcha", label: "Matcha", emoji: "🫖" },
  "코코아": { class: "tag-cocoa", label: "Cocoa", emoji: "🍫" },
  "우유": { class: "tag-milk", label: "Milk", emoji: "🥛" }
};

async function load() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (!id) {
    document.querySelector('h1').textContent = 'Order not found';
    return;
  }

  const res = await fetch('/api/list?id=' + id);
  if (!res.ok) {
    document.querySelector('h1').textContent = 'Failed to load';
    return;
  }

  const data = await res.json();
  const tag = PRODUCT_TAGS[data.product] || { class: "tag-americano", label: data.product, emoji: "☕" };

  document.getElementById('id').textContent = data.id;
  document.getElementById('product').textContent = data.product;
  document.getElementById('buyer_name').textContent = data.buyer_name;
  document.getElementById('quantity').textContent = data.quantity + 'x';
  document.getElementById('price_per_unit').textContent = '₩' + data.price_per_unit.toLocaleString();
  document.getElementById('total_price').textContent = '₩' + data.total_price.toLocaleString();

  const date = new Date(data.purchased_at);
  const dateStr = date.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
  const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('purchased_at').textContent = `${dateStr} ${timeStr}`;

  const tagEl = document.getElementById('tag');
  tagEl.className = 'tag ' + tag.class;
  tagEl.textContent = tag.label;

  const emojiEl = document.getElementById('receipt-emoji');
  emojiEl.textContent = tag.emoji;
}
load();
</script>
</body>
</html>
