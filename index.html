<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Order</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2b2520;
    background: linear-gradient(135deg, #f9f6f1 0%, #f5f0eb 100%);
    min-height: 100vh;
    margin: 0;
    padding: 40px 20px;
  }
  .container { max-width: 480px; margin: 0 auto; }

  .header {
    margin-bottom: 40px;
    text-align: center;
  }
  h1 {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 8px 0;
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 14px;
    color: #8b7d73;
    margin: 0 0 4px 0;
  }
  .nav { margin-top: 12px; }
  .nav a {
    color: #2563eb;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .nav a:hover { text-decoration: underline; }

  .card {
    background: white;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 1px solid #f0ebe6;
  }

  .form-group { margin-bottom: 24px; }
  label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8b7d73;
  }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e5ddd6;
    border-radius: 8px;
    font-size: 15px;
    background: #faf9f7;
    color: #2b2520;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #d2691e;
    background: white;
    box-shadow: 0 0 0 3px rgba(210, 105, 30, 0.1);
  }

  .menu-options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  option {
    padding: 8px;
  }

  .quantity-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  input[type="number"] {
    width: 80px;
  }

  button {
    width: 100%;
    padding: 14px 24px;
    background: #d2691e;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 24px;
  }
  button:hover:not(:disabled) {
    background: #b85a16;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(210, 105, 30, 0.2);
  }
  button:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .msg.ok {
    display: block;
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #c8e6c9;
  }
  .msg.err {
    display: block;
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ffcdd2;
  }

  .divider {
    height: 1px;
    background: #e5ddd6;
    margin: 28px 0;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>☕ Order</h1>
      <p class="subtitle">Place your coffee order</p>
      <div class="nav">
        <a href="list.html">View Sales</a>
      </div>
    </div>

    <div class="card">
      <form id="order-form">
        <div class="form-group">
          <label for="buyer_name">Customer Name</label>
          <input id="buyer_name" name="buyer_name" required placeholder="e.g. Jane Doe">
        </div>

        <div class="form-group">
          <label for="product">Menu</label>
          <select id="product" name="product" required>
            <option value="">Choose a drink...</option>
            <option value="아메리카노">☕ Americano - ₩3,000</option>
            <option value="카페라떼">🥛 Latte - ₩4,000</option>
            <option value="율무차">🫖 Matcha - ₩3,500</option>
            <option value="코코아">🍫 Cocoa - ₩4,000</option>
            <option value="우유">🥛 Milk - ₩2,500</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity</label>
          <div class="quantity-group">
            <input id="quantity" name="quantity" type="number" min="1" value="1" required>
            <span style="color: #8b7d73; font-size: 14px;">cups</span>
          </div>
        </div>

        <button id="btn" type="submit">Place Order</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>

<script>
document.getElementById('order-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.className = 'msg';
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        buyer_name: document.getElementById('buyer_name').value,
        product: document.getElementById('product').value,
        quantity: document.getElementById('quantity').value,
      }),
    });
    if (res.ok) {
      msg.textContent = '✓ Order placed! View it in Sales.';
      msg.className = 'msg ok';
      e.target.reset();
    } else {
      const body = await res.json().catch(() => ({}));
      msg.textContent = '✗ Failed: ' + (body.error || res.status);
      msg.className = 'msg err';
    }
  } catch (err) {
    msg.textContent = '✗ Connection error: ' + err.message;
    msg.className = 'msg err';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
