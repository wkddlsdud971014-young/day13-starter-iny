<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Order</title>
<script defer src="https://cdn.vercel-analytics.com/v1/script.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #2b2520;
    background: linear-gradient(135deg, #f5f1eb 0%, #ede7df 100%);
    min-height: 100vh;
    margin: 0;
    padding: 60px 20px;
  }
  .container { max-width: 520px; margin: 0 auto; }

  .header {
    margin-bottom: 50px;
    text-align: center;
    animation: fadeIn 0.6s ease-in;
  }
  h1 {
    font-size: 42px;
    font-weight: 400;
    margin: 0 0 12px 0;
    letter-spacing: 1px;
    color: #1a1815;
  }
  .subtitle {
    font-size: 15px;
    color: #9b8f85;
    margin: 0 0 8px 0;
    font-weight: 300;
  }
  .nav { margin-top: 16px; }
  .nav a {
    color: #2563eb;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: opacity 0.3s;
  }
  .nav a:hover { opacity: 0.7; }

  .card {
    background: white;
    border-radius: 10px;
    padding: 40px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid #f0ede8;
    animation: slideUp 0.6s ease-out;
  }

  .form-group { margin-bottom: 28px; }
  label {
    display: block;
    margin-bottom: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #9b8f85;
  }

  input, select {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #e8e3de;
    border-radius: 6px;
    font-size: 15px;
    background: #fbfbf9;
    color: #2b2520;
    font-family: 'Georgia', serif;
    transition: all 0.3s ease;
  }
  input::placeholder {
    color: #c9bbb1;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #d4a574;
    background: white;
    box-shadow: 0 0 0 2px rgba(212, 165, 116, 0.08);
  }

  .menu-options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  button {
    width: 100%;
    padding: 15px 24px;
    background: #c9a875;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.4s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 28px;
    font-family: 'Georgia', serif;
  }
  button:hover:not(:disabled) {
    background: #b89660;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(201, 168, 117, 0.2);
  }
  button:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  .msg {
    margin-top: 18px;
    padding: 13px 14px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
    animation: slideDown 0.3s ease-out;
  }
  .msg.ok {
    display: block;
    background: #e8f1e0;
    color: #4a7c3d;
    border: 1px solid #d4e5c9;
  }
  .msg.err {
    display: block;
    background: #f5e8e6;
    color: #8b3d2d;
    border: 1px solid #e8d4d0;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Coffee Order</h1>
      <p class="subtitle">Select your favorite drink</p>
      <div class="nav">
        <a href="list.html">→ View Sales</a>
      </div>
    </div>

    <div class="card">
      <form id="order-form">
        <div class="form-group">
          <label for="buyer_name">Customer Name</label>
          <input id="buyer_name" name="buyer_name" required placeholder="e.g. Jane Doe" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="product">Menu</label>
          <select id="product" name="product" required>
            <option value="">Select a drink</option>
            <option value="아메리카노">☕ Americano - ₩3,000</option>
            <option value="카페라떼">🥛 Latte - ₩4,000</option>
            <option value="율무차">🫖 Matcha - ₩3,500</option>
            <option value="코코아">🍫 Cocoa - ₩4,000</option>
            <option value="우유">🥛 Milk - ₩2,500</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input id="quantity" name="quantity" type="number" min="1" value="1" required>
        </div>

        <button id="btn" type="submit">Place Order</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>

<script>
document.getElementById('order-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.className = 'msg';
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        buyer_name: document.getElementById('buyer_name').value,
        product: document.getElementById('product').value,
        quantity: document.getElementById('quantity').value,
      }),
    });
    if (res.ok) {
      msg.textContent = '✓ Order placed successfully! Check Sales page.';
      msg.className = 'msg ok';
      e.target.reset();
    } else {
      const body = await res.json().catch(() => ({}));
      msg.textContent = '✗ Failed: ' + (body.error || res.status);
      msg.className = 'msg err';
    }
  } catch (err) {
    msg.textContent = '✗ Connection error: ' + err.message;
    msg.className = 'msg err';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
